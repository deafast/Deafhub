<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeafHub — варианты заставки</title><style>
*{box-sizing:border-box}body{margin:0;background:#030709;color:#eafbff;font-family:Arial,sans-serif}header{position:relative;z-index:4;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#071218}button{background:#10252c;color:#eafbff;border:1px solid #32616d;border-radius:8px;padding:12px 16px;min-height:44px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#22d3ee;background:#173d47}button:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}.stage{position:relative;height:calc(100svh - 160px);min-height:330px;overflow:hidden;display:grid;place-items:center}.background{position:absolute;inset:0;background:center/cover url('/preloader/1.jpg');opacity:.15;filter:grayscale(1)}.brand{position:relative;text-align:center}.word{position:relative;font-size:clamp(40px,10vw,100px);font-weight:1000;font-style:italic;letter-spacing:-3px;display:flex;align-items:center;gap:24px;line-height:1.1}.letter{position:relative}.letter.hub{color:#22d3ee}.bar{height:100px;width:7px;border-radius:3px;background:#22d3ee;transform:skewX(-20deg);box-shadow:0 0 24px #22d3ee66}.frame{position:absolute;inset:0;background-size:cover;background-position:center;background-clip:text;-webkit-background-clip:text;color:transparent;opacity:0;filter:brightness(2) contrast(1.3)}.solid{opacity:1}.tag{margin-top:32px;font-size:22px;letter-spacing:.35em;font-weight:900;font-style:italic}.tag:before,.tag:after{content:'';display:inline-block;width:40px;height:2px;background:#22d3ee;margin:0 18px;vertical-align:middle}footer{padding:16px;text-align:center;color:#c1d5db;font-size:15px}.frames{position:absolute;inset:0}.stage.play .frames{animation:frames-end 3s both}@keyframes frames-end{0%,59%{opacity:1}67%,100%{opacity:0}}.stage.play .solid{animation:solid 3s both}.stage.play .brand{animation:out 3s both}.stage.play .frame{animation:frames 2s both;animation-delay:var(--delay)}.stage.play .frame:nth-child(3){animation-delay:.35s}.stage.play .frame:nth-child(4){animation-delay:.7s}.stage.play .frame:nth-child(5){animation-delay:1.05s}.stage.play .frame:nth-child(6){animation-delay:1.4s}.stage.play .frame:nth-child(7){animation-delay:1.7s}.stage.diagonal.play .word{animation:reveal 1.1s cubic-bezier(.23,1,.32,1) both}.stage.cinema.play .word{animation:zoom 2s cubic-bezier(.23,1,.32,1) both}.stage.cinema.play .background{animation:bg 3s ease-out both}@keyframes frames{0%{opacity:0}8%,17%{opacity:1}25%,100%{opacity:0}}@keyframes solid{0%,60%{opacity:0}67%,100%{opacity:1}}@keyframes out{0%,92%{opacity:1}100%{opacity:0}}@keyframes reveal{from{clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{clip-path:polygon(0 0,120% 0,100% 100%,0 100%)}}@keyframes zoom{from{transform:scale(.9);opacity:0}30%{opacity:1}to{transform:scale(1)}}@keyframes bg{from{transform:scale(1.06);opacity:.1}65%{opacity:.2}to{transform:scale(1);opacity:.08}}@media(max-width:500px){.word{gap:14px}.bar{height:65px;width:4px}.tag{font-size:16px}.tag:before,.tag:after{width:20px;margin:0 10px}}@media(prefers-reduced-motion:reduce){.stage.play *{animation:none!important}.frame{display:none}}
</style><header><strong>DEAFHUB · ВЫБОР ЗАСТАВКИ</strong><button data-kind="soft" aria-pressed="true">Плавное смешивание</button><button data-kind="diagonal" aria-pressed="false">Диагональное раскрытие</button><button data-kind="cinema" aria-pressed="false">Кинематографичный вход</button><button id="replay">▶ Повторить</button></header><main class="stage soft" id="stage"><div class="background"></div><div class="brand"><div class="word"><div class="letter" data-word="DEAF"><span class="solid">DEAF</span></div><div class="bar"></div><div class="letter hub" data-word="HUB"><span class="solid">HUB</span></div></div><div class="tag">PLATFORM</div></div></main><footer id="caption">Ваши оригинальные изображения · 2 секунды кадров + 1 секунда надписи · отдельный просмотр</footer><script>
const stage=document.getElementById('stage');let kind='soft';document.querySelectorAll('.letter').forEach(el=>{const holder=document.createElement('span');holder.className='frames';el.append(holder);for(let n=1;n<=6;n++){const span=document.createElement('span');span.className='frame';span.style.animationDelay=((n-1)*.32)+'s';span.textContent=el.dataset.word;span.style.backgroundImage=`url('/preloader/${n}.jpg')`;holder.append(span)}});function play(){stage.className='stage '+kind;void stage.offsetWidth;stage.classList.add('play')}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));play()});document.getElementById('replay').onclick=play;
</script></html>
